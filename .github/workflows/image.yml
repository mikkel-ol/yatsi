# Builds arm64 images and pushes them to GHCR. Argo CD Image Updater rolls them out.
# Generated by add-image-workflows.sh.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - { image: ghcr.io/mikkel-ol/yatsi-server, file: Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: env
        name: Branch -> tag and build settings
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo tag=latest >> "$GITHUB_OUTPUT" ;;
            *) echo "no tag for branch ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ""
          platforms: linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.env.outputs.tag }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.env.outputs.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.env.outputs.tag }}
